# fly.toml app configuration file generated for portfolio-analyzer on 2026-01-15T11:45:07+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfolio-analyzer'
primary_region = 'fra'

[build]

[env]
  PORT = '8000'
  RAILWAY_ENVIRONMENT = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
